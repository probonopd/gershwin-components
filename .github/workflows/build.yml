name: Build Gershwin Components

# Build gershwin-components against the real Gershwin stack by reusing
# gershwin-developer: build the core libraries once ("make corelibs"), then
# build the checkout under test ("make components"). The sources are provided by
# this repo's checkout via a symlink, and SKIP_REPOS keeps Checkout.sh from
# cloning this repo or the sibling apps that are not needed to build corelibs.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  # Dev channel.  When this run is "for dev" -- the branch pushed is dev, the PR
  # head is dev, or the PR targets dev -- we build against the dev side of the
  # whole stack: gershwin-developer is cloned at its dev branch, and BRANCH=dev
  # is handed to checkout.sh so every Gershwin repo that HAS a dev branch is
  # used at dev (repos without one silently fall back to their default branch).
  # gershwin-developer's dev checkout.sh auto-detects a dev run and does this by
  # itself, but only its dev copy does -- and a repo like this one clones
  # gershwin-developer, so before this change it got the main copy, which has no
  # such detection.  Cloning developer at dev is therefore the half that brings
  # the dev-aware scaffolding in, and setting BRANCH explicitly is the half that
  # makes the dev channel a property of this workflow rather than an implicit
  # behaviour of whichever checkout.sh we happen to have cloned.
  # For main, master, or any other branch this is empty, which is identical to
  # not setting it at all -- those builds behave exactly as they did before.
  BRANCH: ${{ (github.ref_name == 'dev' || github.head_ref == 'dev' || github.base_ref == 'dev') && 'dev' || '' }}

  # gershwin-systempreferences is NOT skipped: it provides the PreferencePanes
  # framework that several component prefPanes (Display, Network, Sound, ...)
  # build against, so it is cloned and built before components.
  SKIP_REPOS: >-
    gershwin-components
    gershwin-workspace
    gershwin-eau-theme
    gershwin-terminal
    gershwin-textedit
    gershwin-windowmanager

jobs:
  build-freebsd-14-amd64:
    name: FreeBSD x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: gershwin-components

      - name: Build components inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          sync: rsync
          copyback: false
          cpu: 2
          mem: 4096
          prepare: |
            pkg update
            pkg install -y git curl
          run: |
            set -e
            BASE="$(pwd)"
            # Empty unless this is a dev run; see the BRANCH comment at the top.
            BRANCH="${{ env.BRANCH }}"
            git clone --depth 1 ${BRANCH:+--branch "$BRANCH"} https://github.com/gershwin-desktop/gershwin-developer.git
            cd "$BASE/gershwin-developer"
            ./Library/Scripts/bootstrap.sh
            SKIP_REPOS="${{ env.SKIP_REPOS }}" BRANCH="$BRANCH" ./Library/Scripts/checkout.sh
            ln -sfn "$BASE/gershwin-components" Library/Sources/gershwin-components
            make corelibs
            make systempreferences
            make components

  build-archlinux-x86_64:
    name: Arch x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: archlinux:latest
    steps:
      - name: Install git
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git

      - uses: actions/checkout@v4
        with:
          path: gershwin-components

      - name: Clone gershwin-developer
        # $BRANCH comes from the workflow env above: "dev" on a dev run, empty
        # otherwise, in which case this is the plain default-branch clone.
        run: git clone --depth 1 ${BRANCH:+--branch "$BRANCH"} https://github.com/gershwin-desktop/gershwin-developer.git

      - name: Bootstrap
        working-directory: gershwin-developer
        run: ./Library/Scripts/bootstrap.sh

      - name: Checkout sources (skip this repo and sibling apps)
        working-directory: gershwin-developer
        # SKIP_REPOS and BRANCH are both inherited from the workflow env above.
        run: ./Library/Scripts/checkout.sh

      - name: Link source under test
        working-directory: gershwin-developer
        run: ln -sfn "$GITHUB_WORKSPACE/gershwin-components" Library/Sources/gershwin-components

      - name: Build core libraries
        working-directory: gershwin-developer
        run: make corelibs

      - name: Build systempreferences (provides the PreferencePanes framework)
        working-directory: gershwin-developer
        run: make systempreferences

      - name: Build components
        working-directory: gershwin-developer
        run: make components

  build-debian-x86_64:
    name: Debian x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: debian:bookworm
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get -y install git

      - uses: actions/checkout@v4
        with:
          path: gershwin-components

      - name: Clone gershwin-developer
        # $BRANCH comes from the workflow env above: "dev" on a dev run, empty
        # otherwise, in which case this is the plain default-branch clone.
        run: git clone --depth 1 ${BRANCH:+--branch "$BRANCH"} https://github.com/gershwin-desktop/gershwin-developer.git

      - name: Bootstrap
        working-directory: gershwin-developer
        run: ./Library/Scripts/bootstrap.sh

      - name: Checkout sources (skip this repo and sibling apps)
        working-directory: gershwin-developer
        # SKIP_REPOS and BRANCH are both inherited from the workflow env above.
        run: ./Library/Scripts/checkout.sh

      - name: Link source under test
        working-directory: gershwin-developer
        run: ln -sfn "$GITHUB_WORKSPACE/gershwin-components" Library/Sources/gershwin-components

      - name: Build core libraries
        working-directory: gershwin-developer
        run: make corelibs

      - name: Build systempreferences (provides the PreferencePanes framework)
        working-directory: gershwin-developer
        run: make systempreferences

      - name: Build components
        working-directory: gershwin-developer
        run: make components

  build-openbsd-78-amd64:
    name: OpenBSD x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: gershwin-components

      - name: Build components inside OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.8"
          usesh: true
          sync: rsync
          copyback: false
          cpu: 2
          mem: 4096
          prepare: |
            # pkg_add searches each PKG_PATH location in order. Using several
            # mirrors keeps the job working through transient cdn.openbsd.org
            # outages (which previously left gmake uninstalled and aborted
            # "make corelibs" with "gmake: not found").
            export PKG_PATH="https://ftp.openbsd.org/pub/OpenBSD/%v/packages/%a/:https://mirrors.gigenet.com/pub/OpenBSD/%v/packages/%a/:https://cdn.openbsd.org/pub/OpenBSD/%v/packages/%a/"
            for i in 1 2 3 4 5; do
              pkg_add -I git && exit 0
              echo "pkg_add git failed (attempt $i), retrying..."
              sleep 15
            done
            exit 1
          run: |
            set -e
            BASE="$(pwd)"
            export PKG_PATH="https://ftp.openbsd.org/pub/OpenBSD/%v/packages/%a/:https://mirrors.gigenet.com/pub/OpenBSD/%v/packages/%a/:https://cdn.openbsd.org/pub/OpenBSD/%v/packages/%a/"
            # Empty unless this is a dev run; see the BRANCH comment at the top.
            BRANCH="${{ env.BRANCH }}"
            git clone --depth 1 ${BRANCH:+--branch "$BRANCH"} https://github.com/gershwin-desktop/gershwin-developer.git
            cd "$BASE/gershwin-developer"
            ./Library/Scripts/bootstrap.sh
            # bootstrap.sh tolerates per-package pkg_add failures, so a transient
            # mirror outage can leave required build tools missing. Verify the
            # critical ones and retry to ride out mirror flakiness.
            for i in 1 2 3 4 5; do
              command -v gmake >/dev/null 2>&1 && break
              echo "gmake missing after bootstrap (attempt $i), retrying pkg_add..."
              pkg_add -I gmake || true
              sleep 15
            done
            command -v gmake >/dev/null 2>&1 || { echo "FATAL: gmake not installed"; exit 1; }
            SKIP_REPOS="${{ env.SKIP_REPOS }}" BRANCH="$BRANCH" ./Library/Scripts/checkout.sh
            ln -sfn "$BASE/gershwin-components" Library/Sources/gershwin-components
            make corelibs
            make systempreferences
            make components
