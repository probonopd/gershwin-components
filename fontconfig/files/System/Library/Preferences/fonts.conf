<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<fontconfig>

  <dir>/System/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>

  <include ignore_missing="yes">/System/Library/Preferences/Fontconfig</include>

  <!-- The URW Base 35 fonts expose their bare PostScript names as family
       names (P052 etc.). Rewrite them at scan time so every application
       enumerating fonts through fontconfig sees the traditional names. -->
  <match target="scan">
    <test name="family">
      <string>P052</string>
    </test>
    <edit name="family" mode="assign">
      <string>Palladio</string>
    </edit>
  </match>

  <match target="scan">
    <test name="family">
      <string>C059</string>
    </test>
    <edit name="family" mode="assign">
      <string>Century Schoolbook</string>
    </edit>
  </match>

  <match target="scan">
    <test name="family">
      <string>Z003</string>
    </test>
    <edit name="family" mode="assign">
      <string>Zapf Chancery</string>
    </edit>
  </match>

  <match target="scan">
    <test name="family">
      <string>D050000L</string>
    </test>
    <edit name="family" mode="assign">
      <string>Dingbats</string>
    </edit>
  </match>

  <!-- Sans/Sans-Serif Font -> Nimbus Sans -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Helvetica</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Nimbus Sans</string>
    </edit>
  </match>
  
  <match target="pattern">
    <test qual="any" name="family">
      <string>Arial</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Nimbus Sans</string>
    </edit>
  </match>

  <!-- Monospace/Console/Courier -> Nimbus Mono PS -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Nimbus Mono PS</family>
    </prefer>
  </alias>
  
  <match target="pattern">
    <test qual="any" name="family">
      <string>Courier</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Nimbus Mono PS</string>
    </edit>
  </match>
  
  <match target="pattern">
    <test qual="any" name="family">
      <string>Courier New</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Nimbus Mono PS</string>
    </edit>
  </match>
  
  <match target="pattern">
    <test qual="any" name="family">
      <string>Console</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Nimbus Mono PS</string>
    </edit>
  </match>

  <!-- Serif/Times/Times New Roman -> Nimbus Roman -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Nimbus Roman</family>
    </prefer>
  </alias>
  
  <match target="pattern">
    <test qual="any" name="family">
      <string>Times</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Nimbus Roman</string>
    </edit>
  </match>
  
  <match target="pattern">
    <test qual="any" name="family">
      <string>Times New Roman</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Nimbus Roman</string>
    </edit>
  </match>
  
  <match target="pattern">
    <test qual="any" name="family">
      <string>TimesNewRoman</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Nimbus Roman</string>
    </edit>
  </match>

  <!-- Palatino and its aliases -> Palladio. The URW P052 face is renamed to
       "Palladio" at scan time (above), so the generic URW alias that points
       "Palatino" at "P052" no longer resolves; map it directly instead. -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Palatino</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Palladio</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Palatino Linotype</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Palladio</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>TeX Gyre Pagella</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Palladio</string>
    </edit>
  </match>

  <!-- The remaining Adobe PostScript core (Base-35) families, each mapped to
       its installed URW substitute so that documents requesting the classic
       PostScript name render with a real face instead of falling through to
       the system default. The URW faces are renamed to their traditional
       names at scan time (above), so we point at those final names. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica Narrow</string></test>
    <edit name="family" mode="assign" binding="same"><string>Nimbus Sans Narrow</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Bookman</string></test>
    <edit name="family" mode="assign" binding="same"><string>URW Bookman</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Bookman Old Style</string></test>
    <edit name="family" mode="assign" binding="same"><string>URW Bookman</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ITC Bookman</string></test>
    <edit name="family" mode="assign" binding="same"><string>URW Bookman</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Avant Garde</string></test>
    <edit name="family" mode="assign" binding="same"><string>URW Gothic</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ITC Avant Garde Gothic</string></test>
    <edit name="family" mode="assign" binding="same"><string>URW Gothic</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>AvantGarde</string></test>
    <edit name="family" mode="assign" binding="same"><string>URW Gothic</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>New Century Schoolbook</string></test>
    <edit name="family" mode="assign" binding="same"><string>Century Schoolbook</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Symbol</string></test>
    <edit name="family" mode="assign" binding="same"><string>Standard Symbols PS</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ITC Symbol</string></test>
    <edit name="family" mode="assign" binding="same"><string>Standard Symbols PS</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Zapf Dingbats</string></test>
    <edit name="family" mode="assign" binding="same"><string>Dingbats</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Zapf Chancery</string></test>
    <edit name="family" mode="assign" binding="same"><string>Zapf Chancery</string></edit>
  </match>

</fontconfig>
